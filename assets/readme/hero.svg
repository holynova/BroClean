<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">BroClean — 菜单栏里的浏览器实例管家</title>
  <desc id="desc">深蓝底标题：BroClean，菜单栏里的浏览器实例管家；右侧是三层叠放的浏览器窗口示意，分别标注 Playwright、Claude（已保护）、Codex，右下角一枚绿色保护盾。</desc>

  <rect width="1200" height="360" rx="26" fill="#131a24"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#8fa3c8">MACOS MENU BAR APP · SWIFTUI + APPKIT</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#e8eef7">BroClean</text>
    <text x="56" y="168" font-size="23" fill="#c6d4e8">菜单栏里的浏览器实例管家</text>
    <text x="56" y="204" font-size="19" fill="#8fa3c8">看清 AI 工具与自动化留下的浏览器，先保护、再按组清理。</text>
    <g id="chips" font-size="18" fill="#e8eef7" text-anchor="middle">
      <g><rect x="56" y="238" width="180" height="36" rx="18" fill="#1d2836" stroke="#33465f" stroke-width="1.5"/><text x="146" y="262">macOS 14+</text></g>
      <g><rect x="248" y="238" width="110" height="36" rx="18" fill="#1d2836" stroke="#33465f" stroke-width="1.5"/><text x="303" y="262">Swift 6</text></g>
      <g><rect x="370" y="238" width="126" height="36" rx="18" fill="#1d2836" stroke="#33465f" stroke-width="1.5"/><text x="433" y="262">33 个测试</text></g>
      <g><rect x="508" y="238" width="130" height="36" rx="18" fill="#1d2836" stroke="#33465f" stroke-width="1.5"/><text x="573" y="262">v0.3.0</text></g>
    </g>
    <text x="56" y="316" font-size="17" fill="#8fa3c8">原生 Swift，无第三方运行时依赖 · 桌面端与 CLI 共享逻辑</text>
  </g>

  <g id="stacked-windows" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- 菜单栏 -->
    <rect x="780" y="24" width="370" height="30" rx="9" fill="#0d1117" stroke="#2a3547" stroke-width="1.5"/>
    <g transform="translate(796 32)">
      <rect x="0" y="4" width="12" height="9" rx="2" fill="none" stroke="#5b9dff" stroke-width="1.5"/>
      <rect x="3" y="0" width="12" height="9" rx="2" fill="none" stroke="#5b9dff" stroke-width="1.5"/>
    </g>
    <text x="820" y="45" font-size="17" fill="#e8eef7">BroClean</text>
    <text x="1134" y="45" font-size="17" fill="#8fa3c8" text-anchor="end">5 browsers · 3 headless</text>

    <!-- 后窗：Playwright -->
    <g>
      <rect x="830" y="78" width="250" height="170" rx="12" fill="#1a2432" stroke="#33465f" stroke-width="1.5"/>
      <circle cx="850" cy="96" r="5" fill="#e5484d"/>
      <circle cx="866" cy="96" r="5" fill="#f5c518"/>
      <circle cx="882" cy="96" r="5" fill="#3fb950"/>
      <text x="898" y="102" font-size="18" fill="#a9bcd4">Playwright · Headless</text>
      <line x1="830" y1="112" x2="1080" y2="112" stroke="#33465f" stroke-width="1"/>
      <rect x="850" y="128" width="120" height="10" rx="5" fill="#2a3a4e"/>
      <rect x="850" y="148" width="80" height="10" rx="5" fill="#2a3a4e"/>
    </g>
    <!-- 中窗：Claude 已保护 -->
    <g>
      <rect x="858" y="116" width="250" height="170" rx="12" fill="#223247" stroke="#46608a" stroke-width="1.5"/>
      <circle cx="878" cy="134" r="5" fill="#e5484d"/>
      <circle cx="894" cy="134" r="5" fill="#f5c518"/>
      <circle cx="910" cy="134" r="5" fill="#3fb950"/>
      <text x="926" y="140" font-size="18" fill="#c6d4e8">Claude · 已保护</text>
      <line x1="858" y1="150" x2="1108" y2="150" stroke="#46608a" stroke-width="1"/>
      <rect x="878" y="166" width="120" height="10" rx="5" fill="#33465f"/>
      <rect x="878" y="186" width="80" height="10" rx="5" fill="#33465f"/>
    </g>
    <!-- 前窗：Codex -->
    <g>
      <rect x="886" y="154" width="250" height="170" rx="12" fill="#2b3d55" stroke="#5b9dff" stroke-width="2"/>
      <circle cx="906" cy="172" r="5" fill="#e5484d"/>
      <circle cx="922" cy="172" r="5" fill="#f5c518"/>
      <circle cx="938" cy="172" r="5" fill="#3fb950"/>
      <text x="954" y="178" font-size="18" fill="#e8eef7">Codex · Headless</text>
      <line x1="886" y1="188" x2="1136" y2="188" stroke="#5b9dff" stroke-width="1" opacity="0.5"/>
      <rect x="906" y="204" width="120" height="10" rx="5" fill="#3d5470"/>
      <rect x="906" y="224" width="80" height="10" rx="5" fill="#3d5470"/>
      <rect x="906" y="252" width="170" height="26" rx="8" fill="#1d2836"/>
      <text x="991" y="270" font-size="17" fill="#a9bcd4" text-anchor="middle">420 MB · 8 pages</text>
    </g>
    <!-- 关闭 × 徽标 -->
    <g>
      <circle cx="852" cy="76" r="14" fill="#e5484d" stroke="#131a24" stroke-width="2"/>
      <path d="M846,70 L858,82 M858,70 L846,82" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- 保护盾 -->
    <g>
      <circle cx="1120" cy="302" r="24" fill="#1f7a54" stroke="#34c07f" stroke-width="2"/>
      <path d="M1110,302 L1117,309 L1131,294" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="965" y="350" font-size="18" fill="#8fa3c8" text-anchor="middle">看清来源 · 保护 · 按组清理</text>
  </g>
</svg>
